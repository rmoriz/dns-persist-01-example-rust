[package]
name = "dns-persist-example"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
anyhow = "1"
aws-lc-rs = "1"
base64 = "0.23"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-rustls = "0.27"
hyper-util = { version = "0.1", features = ["client-legacy", "server-auto", "tokio"] }
instant-acme = { git = "https://github.com/rmoriz/instant-acme", branch = "dns-persist-01", features = ["rcgen", "time"] }
rustls = "0.23"
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", default-features = false, features = ["formatting", "macros", "parsing"] }
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
toml = "0.9"
x509-parser = "0.18"

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
