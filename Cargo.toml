[package]
name = "dns-persist-example"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
anyhow = "1"
aws-lc-rs = "1"
base64 = "0.23"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
instant-acme = { path = "../instant-acme", features = ["rcgen"] }
rustls = "0.23"
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
toml = "0.9"
